services:
  postgres:
    image: postgres:16-alpine
    container_name: starter-gov-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: starter
      POSTGRES_PASSWORD: starter_dev_password
      POSTGRES_DB: starter_kit_gov
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../packages/database/drizzle/0000_init.sql:/docker-entrypoint-initdb.d/0000_init.sql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U starter -d starter_kit_gov']
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
      target: runner
    container_name: starter-gov-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://starter:starter_dev_password@postgres:5432/starter_kit_gov
    ports:
      - '8787:8787'

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      target: runner
    container_name: starter-gov-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - '5173:80'

volumes:
  pgdata: